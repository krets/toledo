<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7a6acc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOleDO">
<title>TOleDO</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg:        #0d0d0d;
  --surface:   #1a1a1a;
  --surface2:  #242424;
  --surface3:  #2e2e2e;
  --accent:    #7a6acc;
  --accent-text:#9183d5;
  --accent-dim:rgba(122,106,204,0.15);
  --danger:    #e74c3c;
  --warning:   #f0a500;
  --success:   #2ecc71;
  --text:      #e8e8e8;
  --muted:     #919191;
  --border:    #2a2a2a;
  --r:         8px;
  --top:       52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}

/* ── Topbar ── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top);
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px 0 14px;z-index:100;gap:8px;
}
.brand-icon{
  width:24px;height:24px;border-radius:4px;flex-shrink:0;cursor:pointer;
}
.back-btn{
  background:none;border:none;color:var(--accent-text);cursor:pointer;
  font-size:22px;line-height:1;padding:4px 6px 4px 0;flex-shrink:0;
}
.brand{
  flex:1;font-family:'Playfair Display',Georgia,'Times New Roman',serif;
  font-size:20px;font-weight:700;color:var(--accent-text);letter-spacing:-.2px;
  user-select:none;cursor:pointer;
}
#topbar-tabs{flex:1;display:flex;gap:2px;height:100%;align-items:flex-end;margin-left:10px;min-width:0}
.tb-tab{
  background:none;border:1px solid transparent;border-bottom:none;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--muted);padding:0 14px;height:38px;letter-spacing:-.1px;
  border-radius:8px 8px 0 0;position:relative;top:1px;transition:background .15s,color .15s;
}
.tb-tab:hover{background:var(--surface2);color:var(--text)}
.tb-tab.active{
  color:var(--accent-text);background:var(--bg);border-color:var(--border);
  box-shadow:inset 0 2px 0 var(--accent);
}
@media(max-width:560px){.tb-tab{padding:0 9px;font-size:13px}}
#ham-btn{
  background:none;border:none;color:var(--text);cursor:pointer;
  padding:7px;border-radius:6px;flex-shrink:0;transition:background .15s;
}
#ham-btn:hover{background:var(--surface2)}
#ham-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;display:block}
#ham-wrap{position:relative}
#ham-menu{
  position:absolute;top:calc(100% + 4px);right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.6);
  display:none;z-index:500;overflow:hidden;
}
#ham-menu.open{display:block}
.ham-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;font-size:14px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .1s;
}
.ham-item:last-child{border-bottom:none}
.ham-item:hover{background:var(--surface2)}
.ham-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;color:var(--muted)}
.ham-build{padding:8px 16px;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;cursor:default}

/* Shown when the server has a newer UI than this page */
#update-bar{
  position:fixed;top:calc(var(--top) + 8px);left:50%;transform:translateX(-50%);z-index:450;
  display:none;align-items:center;gap:10px;white-space:nowrap;
  background:var(--accent);color:#fff;padding:7px 8px 7px 14px;border-radius:18px;
  font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.45);
}
#update-bar.show{display:flex}
#update-bar button{background:#fff;color:var(--accent);border:none;border-radius:12px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}

/* ── Main scroll area ── */
#main{
  position:fixed;top:var(--top);bottom:env(safe-area-inset-bottom,0);
  left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}

/* ── FAB ── */
#fab{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0) + 16px);right:16px;
  width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(107,156,232,.45);z-index:99;transition:transform .15s;
}
#fab:active{transform:scale(.93)}
/* The detail panel covers the FAB's corner; sit beside it, or hide when there's no room */
body.panel-open #fab{right:436px}
@media (max-width:500px){body.panel-open #fab{display:none !important}}
/* On wide screens the list narrows to sit beside the panel instead of under it */
@media (min-width:841px){body.panel-open #main{right:420px}}

/* ── Filter bar ── */
.filter-bar{
  display:flex;align-items:center;gap:7px;padding:7px 12px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:9;background:var(--bg);
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-wrap{position:relative;flex-shrink:0}
.filter-btn{
  display:flex;align-items:center;gap:4px;background:var(--surface2);
  border:1px solid var(--border);border-radius:6px;
  padding:5px 10px;font-size:12px;font-weight:500;color:var(--text);
  cursor:pointer;font-family:inherit;transition:border-color .15s;white-space:nowrap;
}
.filter-btn.active{border-color:var(--accent);color:var(--accent-text)}
.filter-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.filter-dropdown{
  position:fixed;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);z-index:400;min-width:200px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
  display:none;overflow:hidden;max-height:60vh;overflow-y:auto;
}
.filter-dropdown.open{display:block}
.fdd-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;font-size:13px;cursor:pointer;transition:background .1s;
  border-bottom:1px solid var(--border);
}
.fdd-item:last-child{border-bottom:none}
.fdd-item:hover{background:var(--surface2)}
.fdd-item.on{color:var(--accent-text);font-weight:600}
.fdd-item .fdd-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fdd-item .fdd-check{margin-left:auto;color:var(--accent-text);font-size:14px;font-weight:700}
.filter-clear{
  padding:4px 10px;font-size:11px;font-weight:600;color:var(--accent);
  cursor:pointer;background:none;border:none;font-family:inherit;flex-shrink:0;
}

/* ── Task cards ── */
.card{
  margin:4px 10px;padding:8px 12px;
  background:var(--surface);border-radius:var(--r);
  border:1px solid var(--border);cursor:pointer;transition:border-color .15s;
}
.card:active{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card.selected{border-color:var(--accent);background:var(--accent-dim)}
.card.overdue{border-left:3px solid var(--danger)}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pri-badge{
  font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:4px;color:#fff;flex-shrink:0;text-transform:uppercase;letter-spacing:.4px;
}
.proj-tag{
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;flex-shrink:0;
}
.tag-chip{
  font-size:11px;color:var(--accent-text);background:var(--accent-dim);
  padding:1px 7px;border-radius:10px;white-space:nowrap;cursor:pointer;
  border:none;font-family:inherit;line-height:1.5;
}
.tag-chip:hover{outline:1px solid var(--accent)}
.tag-chip .x{margin-left:4px;opacity:.7}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.tag-suggest{background:var(--surface2);color:var(--muted)}
.task-name{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;align-items:center;margin-top:3px;gap:6px}
.meta-right{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.due{font-size:12px;color:var(--muted)}
.due.over{color:var(--danger);font-weight:700;background:rgba(231,76,60,.15);padding:1px 6px;border-radius:4px}
.rec-tag{font-size:11px;color:#a66abe}
.sub-count{font-size:11px;color:var(--muted)}
.state-tag{font-size:11px;padding:2px 6px;border-radius:4px}
.s-active{background:var(--accent-dim);color:var(--accent-text)}
.s-completed{background:rgba(46,204,113,.15);color:var(--success)}
.s-archive{background:rgba(136,136,136,.12);color:var(--muted)}

/* ── Journal ── */
.jr-top{display:flex;align-items:baseline;gap:8px}
.jr-date{font-size:12px;font-weight:600;color:var(--accent);flex-shrink:0;min-width:74px}
.jr-title{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-excerpt{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jr-flag{font-size:10px;color:var(--warning);flex-shrink:0}
.jr-raw{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.jr-search{padding:8px 12px 4px}
.jr-filters{display:flex;gap:8px;align-items:center;padding:4px 12px 8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.jr-filters input[type=date]{
  width:auto;flex:0 1 140px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
  padding:6px 9px;color:var(--text);font-size:13px;font-family:inherit;outline:none;color-scheme:dark;
}
.jr-filters input[type=date]:focus{border-color:var(--accent)}
.kebab-wrap{margin-left:auto;position:relative}
.kebab-btn{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 8px;border-radius:6px}
.kebab-btn:hover{background:var(--surface2);color:var(--text)}
.kebab-menu{
  position:absolute;right:0;top:calc(100% + 4px);min-width:180px;z-index:20;display:none;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.6);overflow:hidden;
}
.kebab-menu.open{display:block}
.kebab-item{padding:10px 14px;font-size:13px;cursor:pointer}
.kebab-item:hover{background:var(--surface2)}
.jr-pane{display:flex;gap:6px;padding:10px 14px 0}
.gl-term{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.gl-canon{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.gl-row{display:flex;gap:8px;align-items:flex-start}
.gl-row>div:first-child{flex:1;min-width:0}

/* ── Activity ── */
.act-row{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border);font-size:13px;align-items:baseline}
.act-row.link{cursor:pointer}
.act-row.link:hover{background:var(--surface)}
.act-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.act-time{color:var(--muted);font-size:11px;min-width:38px;flex-shrink:0;font-variant-numeric:tabular-nums}
.act-main{flex:1;min-width:0}
.act-target{font-weight:500;overflow-wrap:anywhere}
.act-target.gone{color:var(--muted);text-decoration:line-through}
.act-parent{color:var(--muted);font-weight:400}
.act-desc{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.act-src{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px}
.act-scope{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.3px;margin-right:6px}
.act-more{display:block;margin:12px auto 24px}
.log-more{background:none;border:none;color:var(--accent);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:8px 0 0}

/* ── Section label ── */
.sec{padding:12px 14px 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ── View header (Archive / Search / Projects) ── */
.view-header{
  padding:14px 14px 10px;border-bottom:1px solid var(--border);
  font-size:16px;font-weight:600;background:var(--surface);
  position:sticky;top:0;z-index:10;
}

/* ── Empty state ── */
.empty{text-align:center;color:var(--muted);padding:48px 24px}
.empty-icon{font-size:40px;margin-bottom:8px}
.empty p{font-size:14px}

/* ── Search bar ── */
.search-wrap{padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:10}
#search-input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:9px 14px;color:var(--text);font-size:15px;
  outline:none;font-family:inherit;transition:border-color .15s;
}
#search-input:focus{border-color:var(--accent)}

/* ── Projects view ── */
.proj-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:10px}
.proj-swatch{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;cursor:pointer;
  position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.15);
}
.proj-swatch input[type="color"]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0;
}
.proj-code{font-size:13px;font-weight:700;min-width:48px;color:var(--accent)}
.proj-name{flex:1;font-size:14px}
.tag-count{font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn.edit:hover{color:var(--accent)}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:4px;line-height:1;font-size:16px;transition:color .15s}
.icon-btn:hover{color:var(--danger)}

/* ── Detail panel ── */
#panel{
  position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;
  background:var(--bg);z-index:200;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
  border-left:1px solid var(--border);
}
#panel.open{transform:translateX(0)}
.panel-head{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:11px 14px;display:flex;align-items:flex-start;gap:10px;flex-shrink:0;
}
.panel-back{background:none;border:none;color:var(--accent-text);cursor:pointer;padding:4px;flex-shrink:0;font-size:20px;line-height:1;margin-top:1px}
.panel-info{flex:1;min-width:0}
.panel-info h2{font-size:16px;font-weight:600;word-break:break-word}
.panel-crumb{background:none;border:none;padding:0;margin-bottom:4px;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.panel-crumb:hover{color:var(--text);text-decoration:underline}
.panel-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.meta-pill{
  display:flex;align-items:center;gap:4px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;
  transition:border-color .15s;color:var(--text);font-family:inherit;
}
.meta-pill:hover{border-color:var(--accent)}
.meta-pill.over{border-color:rgba(231,76,60,.4);color:var(--danger)}
.meta-pill .lbl{color:var(--muted);font-size:11px}
.meta-pill .val{font-weight:500}
.meta-pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;color:var(--muted)}
.panel-actions{
  display:flex;gap:6px;padding:8px 12px;
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;flex-wrap:wrap;
}
.panel-actions::-webkit-scrollbar{display:none}
.abtn{
  padding:6px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:13px;
  cursor:pointer;white-space:nowrap;transition:opacity .15s;font-family:inherit;flex-shrink:0;
}
.abtn:active{opacity:.75}
.abtn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.abtn.dng{background:rgba(231,76,60,.12);color:var(--danger);border-color:rgba(231,76,60,.25)}
.abtn.wrn{background:rgba(240,165,0,.12);color:var(--warning);border-color:rgba(240,165,0,.25)}
.abtn.suc{background:rgba(46,204,113,.12);color:var(--success);border-color:rgba(46,204,113,.25)}
#panel-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.psec{border-bottom:1px solid var(--border)}
.psec-head{
  display:flex;align-items:center;padding:10px 14px;
  font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
}
.psec-head .psec-title{flex:1}
.psec-head .psec-act{
  background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;padding:2px 6px;border-radius:4px;
  border:1px solid transparent;transition:border-color .15s;
}
.psec-head .psec-act:hover{border-color:var(--accent)}
.psec-body{padding:0 14px 14px}
.md h1{font-size:15px;font-weight:600;margin:0 0 8px}
.md h2{font-size:14px;font-weight:600;margin:10px 0 5px}
.md h3{font-size:13px;font-weight:600;margin:8px 0 3px;color:var(--muted)}
.md p{margin-bottom:7px;font-size:14px;line-height:1.6;color:var(--text)}
.md ul{padding-left:18px;margin-bottom:7px}
.md li{font-size:14px;line-height:1.6;margin-bottom:2px}
.md code{background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:13px}
.md pre{background:var(--surface2);padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;margin-bottom:8px}
.md em{font-style:italic;color:var(--muted)}
.md strong{font-weight:600}
.md a{color:var(--accent);text-decoration:none}
.md a:hover{text-decoration:underline}
.md hr{border:none;border-top:1px solid var(--border);margin:10px 0}
.md table{border-collapse:collapse;width:100%;margin-bottom:10px;font-size:13px}
.md th,.md td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.md th{background:var(--surface2);font-weight:600}
.md-empty{font-size:14px;color:var(--muted);font-style:italic}

/* ── Brief view ── */
.brief-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9;background:var(--bg);
}
.brief-tabs{display:flex;gap:7px}
.brief-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.brief-status{padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
.brief-render{padding:12px 14px}
.brief-md-raw{
  margin:0;padding:14px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;
  word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text);
}
.ev-list{padding:4px 14px 14px}
.ev-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.ev-row:last-child{border-bottom:none}
.ev-main{flex:1;min-width:0}
.ev-title{font-size:14px;color:var(--text);text-decoration:none;overflow-wrap:anywhere}
a.ev-title:hover{text-decoration:underline}
.ev-meta{font-size:12px;color:var(--muted);margin-top:2px}
.ev-tag{font-size:11px;border:1px solid var(--border);border-radius:9px;padding:0 6px;margin-left:6px;color:var(--muted)}
.ev-acts{display:flex;gap:4px;flex-shrink:0}
.sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.sub-item:last-child{border-bottom:none}
.sub-check{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--border);background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.sub-check:hover{border-color:var(--accent)}
.sub-check.done{background:var(--success);border-color:var(--success)}
.sub-check.done::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.sub-name{font-size:14px;flex:1;cursor:pointer}
.sub-name:hover{text-decoration:underline}
.sub-name.done{text-decoration:line-through;color:var(--muted)}
.sub-rename{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;opacity:0;transition:opacity .15s;line-height:1}
.sub-item:hover .sub-rename{opacity:1}
.sub-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;opacity:0;transition:opacity .15s;line-height:1}
.sub-delete:hover{color:var(--danger)}
.sub-item:hover .sub-delete{opacity:1}
.note-compose{margin-bottom:14px}
.note-compose textarea{
  width:100%;min-height:64px;resize:vertical;display:block;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
  padding:9px 11px;color:var(--text);font-size:14px;line-height:1.5;font-family:inherit;
  outline:none;transition:border-color .15s;
}
.note-compose textarea:focus{border-color:var(--accent)}
.note-compose-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.note-hint{flex:1;font-size:11px;color:var(--muted)}
@media (hover:none){.note-hint{visibility:hidden}}
.note-compose .btn{flex:none;padding:7px 14px;font-size:13px}
.note-compose .btn:disabled{opacity:.45;cursor:default}
.wlog-entry{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.wlog-entry:last-child{border-bottom:none;margin-bottom:0}
.wlog-ts{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.wlog-acts{display:inline-flex;gap:6px;margin-left:8px}
.wlog-acts .psec-act{padding:1px 8px;font-size:11px}
.wlog-edit{width:100%;min-height:80px;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.6;
  padding:9px 11px;border:1px solid var(--accent);border-radius:var(--r);background:var(--surface2);color:var(--text);resize:vertical;outline:none}
.wlog-text{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.log-details{width:100%}
.log-details summary{
  padding:10px 14px;font-size:12px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:6px;
}
.log-details summary::-webkit-details-marker{display:none}
.log-details summary::before{content:'›';font-size:16px;transition:transform .15s;display:inline-block}
.log-details[open] summary::before{transform:rotate(90deg)}
.log-inner{padding:0 14px 14px}
.log-entry{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.log-entry:last-child{border-bottom:none}
.log-ts{color:var(--muted);font-size:11px;white-space:nowrap;min-width:108px;padding-top:1px}
.log-body{flex:1}
.log-action{font-weight:500}
.log-extras{color:var(--muted);font-size:11px;margin-top:1px}
.over-banner{
  background:rgba(231,76,60,.1);color:var(--danger);
  border:1px solid rgba(231,76,60,.25);border-radius:var(--r);
  padding:7px 11px;font-size:13px;margin:0 14px 10px;
}

/* ── Bottom sheet ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
#overlay.open{opacity:1;pointer-events:all}
#sheet{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-radius:16px 16px 0 0;z-index:301;
  padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  max-height:88vh;display:flex;flex-direction:column;
}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.sheet-title{padding:10px 16px 6px;font-size:16px;font-weight:600;flex-shrink:0}
.sheet-body{padding:6px 16px 16px;overflow-y:auto;flex:1}

/* Forms */
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg textarea,.fg select{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 11px;color:var(--text);
  font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.fg input[type="color"]{
  height:42px;padding:4px 8px;cursor:pointer;
}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--accent)}
.fg textarea{min-height:90px;resize:vertical}
.fg select option{background:var(--surface2)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn-row{display:flex;gap:10px;margin-top:6px}
.pri-quick{display:flex;gap:8px;margin-bottom:13px}
.pq-btn{flex:1;padding:9px 6px;border:none;border-radius:var(--r);color:#fff;font-size:13px;font-weight:700;cursor:pointer;opacity:.9;transition:opacity .15s;font-family:inherit}
.pq-btn:active{opacity:1}
.pri-quick-sm{display:flex;gap:6px}
.pq-btn-sm{flex:1;padding:5px 4px;border:none;border-radius:4px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;opacity:.9;transition:opacity .15s;font-family:inherit}
.pq-btn-sm:active{opacity:1}
.pq-btn.on,.pq-btn-sm.on{opacity:1;box-shadow:0 0 0 2px var(--text)}
.btn{flex:1;padding:12px;border-radius:var(--r);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;font-family:inherit}
.btn:active{opacity:.8}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--surface3);color:var(--text)}
.btn-d{background:var(--danger);color:#fff}

/* Settings */
.settings-section{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);margin:4px 0 12px}
.settings-hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.settings-hint a{color:var(--accent)}
.settings-test{margin-top:12px;padding:9px 11px;border-radius:var(--r);font-size:13px;word-break:break-word}
.settings-test.ok{background:rgba(39,174,96,.12);color:#27ae60}
.settings-test.err{background:rgba(231,76,60,.1);color:var(--danger)}

/* Toast */
#toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0) + 16px);
  left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--surface3);color:var(--text);
  padding:9px 20px;border-radius:18px;font-size:14px;z-index:500;
  opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Chat view */
#chat-view{display:flex;flex-direction:column;height:100%}
#chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:var(--r);font-size:14px;line-height:1.5;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px}
.msg.assistant{align-self:flex-start;background:var(--surface2);color:var(--text);border-bottom-left-radius:2px}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:10px 14px;background:var(--surface2);border-radius:var(--r);align-self:flex-start;margin-bottom:12px}
.dot{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dot:nth-child(1){animation-delay:-0.32s}
.dot:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

#chat-input-wrap{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface)}
#chat-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 16px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
#chat-send{background:var(--accent);color:#fff;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#chat-send:disabled{opacity:.5;cursor:not-allowed}
#chat-send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
// Stamped by the server when it serves this page.
const BUILD = { commit: '__TOLEDO_COMMIT__', built: '__TOLEDO_BUILD_TIME__', ui: '__TOLEDO_UI_BUILD__' };

// ── Priority helpers ──────────────────────────────────────────────────────────
function priLabel(n) {
  n = parseInt(n);
  if (n >= 76)  return 'Ultra High';
  if (n === 75) return 'High';
  if (n >= 51)  return 'Med-High';
  if (n === 50) return 'Medium';
  if (n >= 26)  return 'Med-Low';
  if (n === 25) return 'Low';
  return 'Very Low';
}
function priColor(n) {
  n = parseInt(n);
  if (n >= 76)  return '#d16d63';
  if (n === 75) return '#e95c4e';
  if (n >= 51)  return '#e67e22';
  if (n === 50) return '#f0a500';
  if (n >= 26)  return '#4691c2';
  if (n === 25) return '#27ae60';
  return '#8b8b8b';
}

// List badge: solid only for Ultra High, tinted below that.
function priBadgeStyle(n) {
  n = parseInt(n);
  if (n >= 76) return 'background:#c0392b;color:#fff';
  if (n >= 51) return 'background:rgba(230,126,34,.15);color:#e67e22';
  if (n === 50) return 'background:var(--surface3);color:var(--text)';
  return 'background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--border)';
}

// ── Hex color helpers ─────────────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  hex = hex || '#6b9ce8';
  const r = parseInt(hex.slice(1,3), 16) || 107;
  const g = parseInt(hex.slice(3,5), 16) || 156;
  const b = parseInt(hex.slice(5,7), 16) || 232;
  return `rgba(${r},${g},${b},${alpha})`;
}
// User-picked project colors can be too dark to read as text on the dark theme.
// Lighten toward white just enough to clear WCAG AA (4.5:1) against the surface
// it's actually rendered on (a solid surface, or its own alpha tint over one).
function relLuminance([r, g, b]) {
  const a = [r, g, b].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}
function contrastRatio(fg, bg) {
  const l1 = relLuminance(fg) + 0.05, l2 = relLuminance(bg) + 0.05;
  return l1 > l2 ? l1 / l2 : l2 / l1;
}
function readableAccent(hex, surfaceRgb, tintAlpha = 0) {
  const base = [parseInt(hex.slice(1,3), 16) || 107, parseInt(hex.slice(3,5), 16) || 156, parseInt(hex.slice(5,7), 16) || 232];
  const bg = tintAlpha > 0
    ? base.map((c, i) => c * tintAlpha + surfaceRgb[i] * (1 - tintAlpha))
    : surfaceRgb;
  let rgb = base;
  for (let t = 0; t <= 1.0001; t += 0.02) {
    rgb = base.map(c => c + (255 - c) * t);
    if (contrastRatio(rgb, bg) >= 4.5) break;
  }
  return '#' + rgb.map(c => Math.round(Math.min(255, c)).toString(16).padStart(2, '0')).join('');
}

// ── App state ─────────────────────────────────────────────────────────────────
const App = {
  view: 'tasks',   // 'tasks' | 'search' | 'projects' | 'tags' | 'archive'
  tasks: [],
  projects: {},
  tags: [],        // [{tag, tasks, active}] for every tag in use
  // State filter — multi-select, default active only
  stateFilters: new Set(['active']),
  // Client-side filters
  projFilters: new Set(),
  tagFilters:  new Set(),
  tagMatchAll: false,       // true: a task needs every selected tag, not any
  dueFilter:   'any',       // 'any' | 'overdue' | 'today' | '7' | '14' | '30'
  priFilter:   'any',       // 'any' | 'high' | 'medium' | 'low'
  // Detail panel
  task: null,
  // Search
  query: '',
  results: [],
  // Chat
  chatMessages: [],
  // Journal: list (newest first), its search, and the entry open in the panel
  journalList: [],
  journalQuery: '',
  journalSince: '',
  journalUntil: '',
  journalPane: 'summary',
  glossary: [],
  glossaryQuery: '',
  journal: null,
  // Activity: the loaded page(s) of the event log and its filters
  activity: [],
  activityMore: false,
  activityFilter: { scope: '', project: '', action: '', task: '' },
};

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { 
    method, 
    headers: {
      'Accept': 'application/json',
      'X-Requested-With': 'XMLHttpRequest'
    }, 
    credentials: 'include' 
  };
  if (body) { 
    opts.body = JSON.stringify(body); 
    opts.headers['Content-Type'] = 'application/json'; 
  }
  let r;
  try {
    r = await fetch(path, opts);
  } catch (e) {
    // If fetch fails completely, it might be a CORS block on an unhandled redirect
    // Try to recover by a top-level redirect if we think it's auth-related
    console.error('API Fetch Failure:', e);
    window.location.href = 'https://auth.krets.com/auth/refresh?redirect=' + encodeURIComponent(window.location.href);
    return new Promise(() => {});
  }

  if (r.status === 401) {
    window.location.href = 'https://auth.krets.com/auth/refresh?redirect=' + encodeURIComponent(window.location.href);
    return new Promise(() => {});
  }
  if (!r.ok) {
    const e = await r.json().catch(() => ({ error: r.statusText }));
    throw new Error(e.error || r.statusText);
  }
  return r.json();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
App.toast = function(msg, duration = 2400) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(App._tt);
  App._tt = setTimeout(() => el.classList.remove('show'), duration);
};

App.copyStatus = async function() {
  try {
    const res = await api('GET', '/api/status');
    if (res.status) {
      await navigator.clipboard.writeText(res.status);
      App.toast('✓ Status copied to clipboard');
    }
  } catch (e) {
    App.toast('✗ Failed to copy: ' + e.message);
  }
};

// ── Init ──────────────────────────────────────────────────────────────────────
App.init = async function() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  $('ham-build').textContent = `Build ${BUILD.commit}`;
  App.checkVersion();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') App.checkVersion();
  });
  await Promise.all([App.loadTasks(), App.loadProjects(), App.loadTags()]);
  App.renderMain();
};

// Compare this page's build with the server's; a mismatch means a stale copy.
App.checkVersion = async function() {
  try {
    // Not api(): a failed background check shouldn't bounce to the sign-in page.
    const r = await fetch('/api/version', { credentials: 'include', headers: { 'Accept': 'application/json' } });
    if (!r.ok) return;
    const v = await r.json();
    App.serverVersion = v;
    const started = new Date(v.started).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
    const el = $('ham-build');
    el.textContent = `Build ${BUILD.commit} · deployed ${started}`;
    el.title = `Page UI ${BUILD.ui}, server UI ${v.ui}, server commit ${v.commit}`;
    $('update-bar').classList.toggle('show', v.ui !== BUILD.ui);
  } catch(e) { /* offline or signed out; nothing to compare */ }
};

// Shown in the About dialog (logo tap): the build this page was served from
// plus what the server is currently running, so a stale deploy is obvious.
App.aboutBody = function() {
  const v = App.serverVersion;
  const fmtTs = iso => {
    if (!iso || iso === 'unknown') return 'Unknown';
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString([], {year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
  };
  const stale = v && v.ui !== BUILD.ui;
  return `
    <div class="fg"><label>Commit</label><div style="font-family:ui-monospace,monospace">${esc(v?.commit || BUILD.commit)}</div></div>
    <div class="fg"><label>Built</label><div>${esc(fmtTs(v?.built))}</div></div>
    <div class="fg"><label>Server running since</label><div>${esc(v ? fmtTs(v.started) : 'Unknown')}</div></div>
    ${stale ? `<div class="fg"><label>⚠ Stale page</label><div>This page is an older UI build than the server. <button class="btn btn-p" style="margin-top:6px" onclick="location.reload()">Reload</button></div></div>` : ''}
    <div class="btn-row">
      <button class="btn btn-s" onclick="App.closeSheet()">Close</button>
    </div>`;
};

App.loadTasks = async function() {
  try {
    // Archive is a separate view; tasks view always loads active+completed (filtered client-side)
    const params = App.view === 'archive' ? ['state=archive'] : [];
    App.tasks = await api('GET', '/api/tasks' + (params.length ? '?' + params.join('&') : ''));
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.loadProjects = async function() {
  try { App.projects = await api('GET', '/api/projects'); } catch {}
};

App.loadTags = async function() {
  try { App.tags = await api('GET', '/api/tags'); } catch {}
};

// ── Client-side filtering ─────────────────────────────────────────────────────
App.filteredTasks = function() {
  let tasks = App.tasks;

  // State filter (empty set = show all)
  if (App.stateFilters.size > 0) {
    tasks = tasks.filter(t => App.stateFilters.has(t.state));
  }

  if (App.projFilters.size > 0) {
    tasks = tasks.filter(t => App.projFilters.has(t.project));
  }

  if (App.tagFilters.size > 0) {
    const want = [...App.tagFilters];
    tasks = tasks.filter(t => App.tagMatchAll
      ? want.every(g => t.tags.includes(g))
      : want.some(g => t.tags.includes(g)));
  }

  if (App.dueFilter !== 'any') {
    const today = new Date(); today.setHours(0,0,0,0);
    tasks = tasks.filter(t => {
      if (App.dueFilter === 'overdue') return t.overdue;
      if (!t.due) return false;
      const d = new Date(t.due + 'T00:00:00');
      if (App.dueFilter === 'today') return d <= today;
      const cutoff = new Date(today);
      cutoff.setDate(cutoff.getDate() + parseInt(App.dueFilter));
      return d <= cutoff;
    });
  }

  if (App.priFilter !== 'any') {
    tasks = tasks.filter(t => {
      const p = parseInt(t.priority);
      if (App.priFilter === 'high')   return p >= 51;
      if (App.priFilter === 'medium') return p === 50;
      if (App.priFilter === 'low')    return p <= 49;
      return true;
    });
  }

  return tasks;
};

// ── Views ─────────────────────────────────────────────────────────────────────
App.setView = function(v) {
  // Close menus
  document.querySelectorAll('.filter-dropdown,#ham-menu').forEach(d => d.classList.remove('open'));
  if (App.journal && v !== 'journal') App.closePanel();
  App.view = v;
  if (v === 'settings') { App.loadSettings(); return; }
  if (v === 'journal') { App.loadJournal().then(() => App.renderMain()); return; }
  if (v === 'glossary') { App.loadGlossary().then(() => App.renderMain()); return; }
  if (v === 'activity') { App.loadActivity().then(() => App.renderMain()); return; }
  if (v === 'tags') { App.loadTags().then(() => App.renderMain()); return; }
  if (v === 'brief') { App.loadBrief().then(() => App.renderMain()); return; }
  App.loadTasks().then(() => App.renderMain());
};

App.goHome = function() {
  if (App.journal) App.closePanel();
  App.view = 'tasks';
  App.loadTasks().then(() => App.renderMain());
};

App.renderMain = function() {
  const el = $('main');
  const fab = $('fab');
  const back = $('back-btn');
  $('tb-tasks').classList.toggle('active', App.view === 'tasks');
  $('tb-brief').classList.toggle('active', App.view === 'brief');
  $('tb-journal').classList.toggle('active', App.view === 'journal');
  $('tb-glossary').classList.toggle('active', App.view === 'glossary');
  switch (App.view) {
    case 'tasks':
      el.innerHTML = App.buildTasksView();
      fab.style.display = 'flex';
      back.style.display = 'none';
      break;
    case 'brief':
      el.innerHTML = App.buildBriefView();
      fab.style.display = 'none';
      back.style.display = 'none';
      break;
    case 'archive':
      el.innerHTML = App.buildArchiveView();
      fab.style.display = 'none';
      back.style.display = 'block';
      break;
    case 'search':
      el.innerHTML = App.buildSearchView();
      fab.style.display = 'none';
      back.style.display = 'block';
      setTimeout(() => { const i = $('search-input'); if (i) i.focus(); }, 100);
      break;
    case 'projects':
      el.innerHTML = App.buildProjectsView();
      fab.style.display = 'none';
      back.style.display = 'block';
      break;
    case 'tags':
      el.innerHTML = App.buildTagsView();
      fab.style.display = 'none';
      back.style.display = 'block';
      break;
    case 'journal':
      el.innerHTML = App.buildJournalView();
      fab.style.display = 'flex';
      back.style.display = 'none';
      break;
    case 'glossary':
      el.innerHTML = App.buildGlossaryView();
      fab.style.display = 'flex';
      back.style.display = 'none';
      break;
    case 'activity':
      el.innerHTML = App.buildActivityView();
      fab.style.display = 'none';
      back.style.display = 'block';
      break;
    case 'settings':
      el.innerHTML = App.buildSettingsView();
      fab.style.display = 'none';
      back.style.display = 'block';
      break;
    case 'chat':
      el.innerHTML = App.buildChatView();
      fab.style.display = 'none';
      back.style.display = 'block';
      App.scrollChat();
      setTimeout(() => { const i = $('chat-input'); if (i) i.focus(); }, 100);
      break;
  }
};

// ── Chat view ─────────────────────────────────────────────────────────────────
App.buildChatView = function() {
  const msgs = App.chatMessages.length ? App.chatMessages : [{role:'assistant', content:'Hello! I can help you with your tasks. What’s on your mind?'}];
  let html = `<div id="chat-view"><div id="chat-msgs">`;
  msgs.forEach(m => {
    if (m.role === 'tool' || m.tool_calls) return; // Hide internal tool messages
    html += `<div class="msg ${m.role}">${mdToHtml(m.content || '')}</div>`;
  });
  if (App.isChatLoading) {
    html += `<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  }
  html += `</div><div id="chat-input-wrap">
    <input id="chat-input" placeholder="Ask Toledo…" onkeydown="if(event.key==='Enter') App.sendChatMessage()">
    <button id="chat-send" onclick="App.sendChatMessage()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polyline points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div></div>`;
  return html;
};

App.scrollChat = function() {
  const m = $('chat-msgs');
  if (m) m.scrollTop = m.scrollHeight;
};

App.sendChatMessage = async function() {
  const inp = $('chat-input');
  const btn = $('chat-send');
  const text = inp.value.trim();
  if (!text || App.isChatLoading) return;

  inp.value = '';
  inp.disabled = true;
  btn.disabled = true;

  App.chatMessages.push({ role: 'user', content: text });
  App.isChatLoading = true;
  App.renderMain();

  try {
    const res = await api('POST', '/api/chat', { messages: App.chatMessages });
    App.chatMessages = res.history || App.chatMessages; // Update with history from server
  } catch(e) {
    App.chatMessages.push({ role: 'assistant', content: 'Error: ' + e.message });
  }

  App.isChatLoading = false;
  inp.disabled = false;
  btn.disabled = false;
  App.renderMain();
};

// ── Brief view ────────────────────────────────────────────────────────────────
App.loadBrief = async function() {
  try { App.brief = await api('GET', '/api/brief'); } catch(e) { App.toast('✗ ' + e.message); }
};

App.setBriefTab = async function(t) {
  App.briefTab = t;

  else await App.loadBrief();  // a dismissed event may have changed the rendered brief
  App.renderMain();

// Events tab: upcoming events with their internal ids, manageable without an MCP client.
App.briefEventFilter = 'active';

App.loadBriefEvents = async function() {
  try {
    const res = await api('GET', '/api/brief/events?status=all&accepted=1');
    App.briefEvents = res.events;
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.setBriefEventFilter = function(f) {
  App.briefEventFilter = f;
  App.renderMain();
};

App.setBriefEventStatus = async function(id, status, similar) {
  try {
    const res = await api('POST', '/api/brief/events/status', { ids: [id], status, similar: !!similar });
    if (res.updated > 1) App.toast(`✓ ${res.updated} events ${status === 'active' ? 'restored' : status}`);
    await App.loadBriefEvents();
    App.renderMain();
  } catch(e) { App.toast('✗ ' + e.message); }

App.buildBriefEvents = function() {
  const all = App.briefEvents;
  if (!all) return `<div class="empty"><p>Loading…</p></div>`;
  const f = App.briefEventFilter;
  const match = e => f === 'calendar' ? e.accepted : (!e.accepted && e.status === f);
  const count = k => all.filter(e => k === 'calendar' ? e.accepted : (!e.accepted && e.status === k)).length;
  const filters = [['active', 'Active'], ['dismissed', 'Dismissed'], ['muted', 'Muted'], ['calendar', 'On calendar']];
  const evs = all.filter(match);
  const fmtDay = iso => new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const act = (id, status, label, similar) => `<button class="abtn" title="${similar ? 'Also every upcoming event with a near-identical title' : ''}" onclick="App.setBriefEventStatus('${esc(id)}','${status}'${similar ? ',true' : ''})">${label}</button>`;
  return `<div class="brief-bar"><div class="brief-tabs">${filters.map(([k, label]) =>
      `<button class="filter-btn${f === k ? ' active' : ''}" onclick="App.setBriefEventFilter('${k}')">${label} ${count(k)}</button>`).join('')}</div></div>
    <div class="ev-list">${evs.length ? evs.map(e => `
      <div class="ev-row">
        <div class="ev-main">
          ${e.url ? `<a class="ev-title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : `<span class="ev-title">${esc(e.title)}</span>`}${e.updated ? '<span class="ev-tag">updated</span>' : ''}
          <div class="ev-meta">${esc(fmtDay(e.start))}${e.where ? ' · ' + esc(e.where) : ''} · ${esc(e.source || '')} · ${esc(e.ref)}${(e.same || []).length ? ` · +${e.same.length} same (${esc(e.same.join(', '))})` : ''}</div>
        </div>
        <div class="ev-acts">${e.accepted ? '' : e.status === 'active'
          ? act(e.ref, 'dismissed', 'Dismiss') + act(e.ref, 'dismissed', 'Series', true) + act(e.ref, 'muted', 'Mute')
          : act(e.ref, 'active', 'Restore')}</div>
      </div>`).join('') : '<p class="md-empty" style="padding:14px 0">Nothing here.</p>'}</div>`;
};

App.buildBriefView = function() {
  if (!App.brief) return `<div class="view-header">Brief</div><div class="empty"><p>Loading…</p></div>`;
  const b = App.brief;
  const tab = App.briefTab || 'render';
  const copyIcon = `<svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>`;
  let status = b.running ? 'Collecting now…' : (b.last_run
    ? `Last run ${fmtBriefTime(b.last_run.finished_at)}${b.last_run.ok === false ? ' — failed' : ''}`
    : 'No run yet');
  if (b.next_run && b.next_run.note) status += ` · Next run: ${esc(b.next_run.note)}`;
  return `<div class="view-header">Brief</div>
    <div class="brief-bar">
      <div class="brief-tabs">
        <button class="filter-btn${tab === 'render' ? ' active' : ''}" onclick="App.setBriefTab('render')">Render</button>
        <button class="filter-btn${tab === 'markdown' ? ' active' : ''}" onclick="App.setBriefTab('markdown')">Markdown</button>
        <button class="filter-btn${tab === 'events' ? ' active' : ''}" onclick="App.setBriefTab('events')">Events</button>
      </div>
      <div class="brief-actions">
        ${tab === 'markdown' ? `<button class="icon-btn" title="Copy Markdown" onclick="App.copyBriefMarkdown()">${copyIcon}</button>` : ''}
        <button class="abtn" onclick="App.runBriefNow()"${b.running ? ' disabled' : ''}>${b.running ? 'Running…' : 'Run now'}</button>
      </div>
    </div>
    <div class="brief-status">${esc(status)}</div>
    ${tab === 'events' ? App.buildBriefEvents() : tab === 'render'
      ? `<div class="md brief-render">${b.markdown ? mdToHtml(b.markdown) : '<p class="md-empty">No brief generated yet.</p>'}</div>`
      : `<pre class="brief-md-raw">${esc(b.markdown || '')}</pre>`}`;
};

App.copyBriefMarkdown = async function() {
  try {
    await navigator.clipboard.writeText(App.brief?.markdown || '');
    App.toast('✓ Copied Markdown to clipboard');
  } catch(e) { App.toast('✗ Failed to copy: ' + e.message); }
};

App.runBriefNow = async function() {
  try {
    const res = await api('POST', '/api/brief/run');
    App.toast(res.started ? '✓ Brief run started' : 'A run is already in progress');
    setTimeout(() => App.loadBrief().then(() => { if (App.view === 'brief') App.renderMain(); }), 1500);
  } catch(e) { App.toast('✗ ' + e.message); }
};

function fmtBriefTime(iso) {
  if (!iso) return 'unknown';
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ── Tasks view ────────────────────────────────────────────────────────────────
App.buildTasksView = function() {
  const filterBar = App.buildFilterBar();
  const tasks = App.filteredTasks();
  // Show state badge/section header when completed tasks may be visible
  const showState = App.stateFilters.size !== 1 || App.stateFilters.has('completed');

  if (!tasks.length) {
    return filterBar + App.activeFiltersInfo() +
      `<div class="empty"><div class="empty-icon">📋</div><p>No tasks</p></div>`;
  }

  const order = ['active', 'completed'];
  const groups = {};
  tasks.forEach(t => { (groups[t.state] = groups[t.state] || []).push(t); });

  let html = filterBar + App.activeFiltersInfo();
  order.forEach(s => {
    if (!groups[s]) return;
    if (showState) html += `<div class="sec">${s.charAt(0).toUpperCase() + s.slice(1)}</div>`;
    groups[s].forEach(t => { html += App.buildCard(t, false); });
  });
  return html;
};

// ── Archive view ──────────────────────────────────────────────────────────────
App.buildArchiveView = function() {
  const tasks = App.filteredTasks();
  const filterBar = App.buildFilterBar();
  if (!tasks.length) {
    return `<div class="view-header">Archive</div>` + filterBar +
      `<div class="empty"><div class="empty-icon">📦</div><p>Archive is empty</p></div>`;
  }
  let html = `<div class="view-header">Archive</div>` + filterBar;
  tasks.forEach(t => { html += App.buildCard(t, false); });
  return html;
};

// ── Filter bar ────────────────────────────────────────────────────────────────
App.buildFilterBar = function() {
  const codes = Object.keys(App.projects).sort();
  const sf = App.stateFilters;
  const hasStateFilter = !(sf.size === 1 && sf.has('active'));  // non-default
  const hasProjFilter  = App.projFilters.size > 0;
  const hasTagFilter   = App.tagFilters.size > 0;
  const hasDueFilter   = App.dueFilter !== 'any';
  const hasPriFilter   = App.priFilter !== 'any';

  // Status dropdown (multi-select)
  const stateOpts = ['active', 'completed'];
  const stateLabel = sf.size === 0 ? 'All'
    : sf.size === 2 ? 'Active + Completed'
    : sf.has('active') ? 'Active' : 'Completed';
  let stateDd = stateOpts.map(s => {
    const on = sf.has(s);
    const check = on ? '<span class="fdd-check">✓</span>' : '';
    return `<div class="fdd-item${on ? ' on' : ''}" onclick='App.toggleStateFilter(${JSON.stringify(s)})'>${s.charAt(0).toUpperCase()+s.slice(1)}${check}</div>`;
  }).join('');

  // Project dropdown
  const projLabel = hasProjFilter
    ? (App.projFilters.size === 1 ? projName([...App.projFilters][0]) : `${App.projFilters.size} projects`)
    : 'Projects';
  let projDd = `<div class="fdd-item${!hasProjFilter ? ' on' : ''}" onclick="App.clearProjFilters()">All Projects</div>`;
  codes.forEach(code => {
    const on = App.projFilters.has(code);
    const dot = `<span class="fdd-dot" style="background:${projColor(code)}"></span>`;
    const check = on ? '<span class="fdd-check">✓</span>' : '';
    projDd += `<div class="fdd-item${on ? ' on' : ''}" onclick='App.toggleProjFilter(${JSON.stringify(code)})'>${dot}${esc(projName(code))}${check}</div>`;
  });

  // Tag dropdown (multi-select, any/all)
  const tagLabel = hasTagFilter
    ? (App.tagFilters.size === 1 ? '#' + [...App.tagFilters][0]
       : `${App.tagFilters.size} tags (${App.tagMatchAll ? 'all' : 'any'})`)
    : 'Tags';
  let tagDd = `<div class="fdd-item${!hasTagFilter ? ' on' : ''}" onclick="App.clearTagFilters()">All Tags</div>`;
  if (App.tagFilters.size > 1) {
    tagDd += `<div class="fdd-item" onclick="App.toggleTagMatch()">Match ${App.tagMatchAll ? 'all' : 'any'} of these
      <span class="fdd-check" style="font-weight:500;font-size:12px">switch to ${App.tagMatchAll ? 'any' : 'all'}</span></div>`;
  }
  if (!App.tags.length) {
    tagDd += `<div class="fdd-item" style="color:var(--muted);cursor:default">No tags yet</div>`;
  }
  App.tags.forEach(({ tag, active }) => {
    const on = App.tagFilters.has(tag);
    const check = on ? '<span class="fdd-check">✓</span>' : `<span class="fdd-check" style="color:var(--muted);font-weight:400;font-size:12px">${active}</span>`;
    tagDd += `<div class="fdd-item${on ? ' on' : ''}" onclick='App.toggleTagFilter(${JSON.stringify(tag)})'>#${esc(tag)}${check}</div>`;
  });

  // Due date dropdown
  const dueLabelMap = {any:'Any Date',overdue:'Overdue',today:'Today','7':'Next 7 Days','14':'Next 14 Days','30':'Next 30 Days'};
  const dueLabel = dueLabelMap[App.dueFilter] || 'Any Date';
  let dueDd = Object.entries(dueLabelMap).map(([v,l]) =>
    `<div class="fdd-item${App.dueFilter === v ? ' on' : ''}" onclick='App.setDueFilter(${JSON.stringify(v)})'>${l}</div>`
  ).join('');

  // Priority dropdown
  const priLabelMap = {any:'Any Priority',high:'High (51–99)',medium:'Medium (50)',low:'Low (1–49)'};
  const priLabelText = priLabelMap[App.priFilter] || 'Any Priority';
  let priDd = Object.entries(priLabelMap).map(([v,l]) =>
    `<div class="fdd-item${App.priFilter === v ? ' on' : ''}" onclick='App.setPriFilter(${JSON.stringify(v)})'>${l}</div>`
  ).join('');

  const chevron = `<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>`;

  let html = `<div class="filter-bar">
    <div class="filter-wrap">
      <button class="filter-btn${hasStateFilter ? ' active' : ''}" onclick="App.toggleDropdown('state-dd',event)">
        ${esc(stateLabel)} ${chevron}
      </button>
      <div class="filter-dropdown" id="state-dd">${stateDd}</div>
    </div>
    <div class="filter-wrap">
      <button class="filter-btn${hasProjFilter ? ' active' : ''}" onclick="App.toggleDropdown('proj-dd',event)">
        ${esc(projLabel)} ${chevron}
      </button>
      <div class="filter-dropdown" id="proj-dd">${projDd}</div>
    </div>
    <div class="filter-wrap">
      <button class="filter-btn${hasTagFilter ? ' active' : ''}" onclick="App.toggleDropdown('tag-dd',event)">
        ${esc(tagLabel)} ${chevron}
      </button>
      <div class="filter-dropdown" id="tag-dd">${tagDd}</div>
    </div>
    <div class="filter-wrap">
      <button class="filter-btn${hasDueFilter ? ' active' : ''}" onclick="App.toggleDropdown('due-dd',event)">
        ${esc(dueLabel)} ${chevron}
      </button>
      <div class="filter-dropdown" id="due-dd">${dueDd}</div>
    </div>
    <div class="filter-wrap">
      <button class="filter-btn${hasPriFilter ? ' active' : ''}" onclick="App.toggleDropdown('pri-dd',event)">
        ${esc(priLabelText)} ${chevron}
      </button>
      <div class="filter-dropdown" id="pri-dd">${priDd}</div>
    </div>`;

  if (hasStateFilter || hasProjFilter || hasTagFilter || hasDueFilter || hasPriFilter) {
    html += `<button class="filter-clear" onclick="App.clearAllFilters()">Clear</button>`;
  }
  return html + '</div>';
};

App.activeFiltersInfo = function() {
  const shown = App.filteredTasks().length;
  const hasProjFilter = App.projFilters.size > 0;
  const hasTagFilter  = App.tagFilters.size > 0;
  const hasDueFilter  = App.dueFilter !== 'any';
  const hasPriFilter  = App.priFilter !== 'any';
  if (!hasProjFilter && !hasTagFilter && !hasDueFilter && !hasPriFilter) return '';
  return `<div style="padding:4px 14px;font-size:11px;color:var(--muted)">${shown} task${shown !== 1 ? 's' : ''} shown</div>`;
};

App.toggleDropdown = function(id, e) {
  if (e) e.stopPropagation();
  const dd = $(id);
  if (!dd) return;
  const wasOpen = dd.classList.contains('open');
  document.querySelectorAll('.filter-dropdown,#ham-menu').forEach(d => d.classList.remove('open'));
  if (!wasOpen) {
    // Position fixed relative to the trigger button
    const btn = e && e.target ? e.target.closest('.filter-btn') : null;
    if (btn) {
      const r = btn.getBoundingClientRect();
      dd.style.top  = (r.bottom + 4) + 'px';
      dd.style.left = r.left + 'px';
    }
    dd.classList.add('open');
  }
};

App.toggleHamMenu = function(e) {
  if (e) e.stopPropagation();
  const menu = $('ham-menu');
  const wasOpen = menu.classList.contains('open');
  document.querySelectorAll('.filter-dropdown,#ham-menu').forEach(d => d.classList.remove('open'));
  if (!wasOpen) menu.classList.add('open');
};

document.addEventListener('click', () => {
  document.querySelectorAll('.filter-dropdown,#ham-menu').forEach(d => d.classList.remove('open'));
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const menus = document.querySelectorAll('.filter-dropdown.open,#ham-menu.open');
    if ($('sheet').classList.contains('open')) App.closeSheet();
    else if (menus.length) menus.forEach(d => d.classList.remove('open'));
    else if (App.panelOpen()) App.closePanel();
    else return;
    e.preventDefault();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || $('sheet').classList.contains('open')) return;
  const t = e.target;
  const card = t.closest && t.closest('.card[data-slug]');
  if (card && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    App.openTask(card.dataset.slug);
    return;
  }
  if (t.matches && t.matches('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'j' || e.key === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!card && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) return;
    const cards = [...document.querySelectorAll('#main .card[data-slug]')];
    if (!cards.length) return;
    e.preventDefault();
    const down = e.key === 'j' || e.key === 'ArrowDown';
    let i = cards.indexOf(card || cards.find(c => c.classList.contains('selected')));
    i = i < 0 ? (down ? 0 : cards.length - 1) : Math.max(0, Math.min(cards.length - 1, i + (down ? 1 : -1)));
    cards[i].focus();
    cards[i].scrollIntoView({ block: 'nearest' });
    if (App.panelOpen()) App.openTask(cards[i].dataset.slug);
  } else if (e.key === 'n' && (App.view === 'tasks' || App.view === 'journal' || App.view === 'glossary')) {
    e.preventDefault();
    App.openSheet(App.fabSheet());
  } else if (e.key === '/') {
    e.preventDefault();
    App.setView('search');
    setTimeout(() => $('search-input')?.focus(), 0);
  }
});

// ── Task card ─────────────────────────────────────────────────────────────────
App.buildCard = function(t, showState) {
  const dueHtml = t.due
    ? `<span class="due${t.overdue ? ' over' : ''}">${t.overdue ? '⚠ ' : ''}${t.due}</span>`
    : '';
  const recHtml   = t.recurrence ? `<span class="rec-tag">↻ ${t.recurrence}d</span>` : '';
  const stateHtml = showState ? `<span class="state-tag s-${t.state}">${t.state}</span>` : '';
  const totalSubs = t.subtasks.active.length + t.subtasks.completed.length;
  const subHtml   = totalSubs > 0
    ? `<span class="sub-count">${t.subtasks.completed.length}/${totalSubs} subtasks</span>` : '';

  const tagHtml = (t.tags || []).length
    ? `<span class="tag-list">${t.tags.map(g =>
        `<button class="tag-chip" onclick='App.filterByTag(${JSON.stringify(g)}, event)' title="Show #${esc(g)} tasks">#${esc(g)}</button>`
      ).join('')}</span>` : '';

  const pl = priLabel(t.priority);
  const pColorRaw = projColor(t.project);
  const pBg = hexToRgba(pColorRaw, 0.15);
  const pColor = readableAccent(pColorRaw, [26, 26, 26], 0.15);
  const cls = 'card' + (t.overdue ? ' overdue' : '') + (App.task && App.panelOpen() && App.task.ref === t.slug ? ' selected' : '');

  return `<div class="${cls}" role="button" tabindex="0" data-slug="${esc(t.slug)}" onclick='App.openTask(${JSON.stringify(t.slug)})'>
    <div class="card-top">
      <span class="pri-badge" style="${priBadgeStyle(t.priority)}">${pl}</span>
      <span class="proj-tag" style="background:${pBg};color:${pColor}">${esc(projName(t.project))}</span>
      <span class="task-name">${esc(t.name)}</span>
    </div>
    <div class="card-meta">${tagHtml}${recHtml}${stateHtml}<span class="meta-right">${subHtml}${dueHtml}</span></div>
  </div>`;
};

// ── Search view ───────────────────────────────────────────────────────────────
App.buildSearchView = function() {
  let html = `<div class="search-wrap">
    <input id="search-input" type="search" placeholder="Search tasks…"
      value="${esc(App.query)}" oninput="App.onSearch(this.value)" autocomplete="off">
  </div>`;
  if (!App.query) {
    return html + `<div class="empty"><div class="empty-icon">🔍</div><p>Search names, tags, descriptions, and notes</p></div>`;
  }
  if (!App.results.length) {
    return html + `<div class="empty"><p>No results for "${esc(App.query)}"</p></div>`;
  }
  App.results.forEach(t => { html += App.buildCard(t, true); });
  return html;
};

App.onSearch = async function(q) {
  App.query = q;
  if (!q.trim()) { App.results = []; App.renderMain(); return; }
  try { App.results = await api('GET', '/api/search?q=' + encodeURIComponent(q)); } catch {}
  App.renderMain();
  const inp = $('search-input');
  if (inp) { inp.focus(); inp.setSelectionRange(q.length, q.length); }
};

// ── Projects view ─────────────────────────────────────────────────────────────
App.buildProjectsView = function() {
  let html = `<div class="view-header">Edit Projects</div>
    <div style="padding:8px 10px 4px;display:flex;justify-content:flex-end">
      <button class="abtn pri" onclick="App.openSheet('new-project')">+ Add project</button>

  codes.forEach(code => {
    const pColor = projColor(code);

    html += `<div class="proj-row">
      <label class="proj-swatch" style="background:${esc(pColor)}" title="Pick color">
        <input type="color" value="${esc(pColor)}" onchange='App.updateProjectColor(${JSON.stringify(code)}, this.value)'>
      </label>
      <span class="proj-code">${esc(code)}</span>
      <span class="proj-name">${esc(pName)}</span>
      <button class="icon-btn" onclick='App.deleteProject(${JSON.stringify(code)})' title="Remove">✕</button>
    </div>`;

  return html + '</div>';
};

App.updateProjectColor = async function(code, color) {
  try {
    App.projects = await api('PATCH', `/api/projects/${encodeURIComponent(code)}`, { color });
    App.renderMain();
    App.toast(`✓ Color updated`);
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.deleteProject = async function(code) {
  if (!confirm(`Remove project "${code}"?`)) return;
  try {
    await api('DELETE', `/api/projects/${code}`);
    await App.loadProjects();
    App.renderMain();
    App.toast(`Removed ${code}`);
  } catch(e) { App.toast('✗ ' + e.message); }
};

// ── Tags view ─────────────────────────────────────────────────────────────────
App.buildTagsView = function() {
  let html = `<div class="view-header">Edit Tags</div>`;
  if (!App.tags.length) {
    return html + `<div class="empty"><div class="empty-icon">🏷️</div><p>No tags yet. Add them from a task's Tags pill.</p></div>`;
  }
  html += `<div style="background:var(--surface);border-radius:var(--r);margin:8px 10px;border:1px solid var(--border)">`;
  App.tags.forEach(({ tag, tasks, active }) => {
    html += `<div class="proj-row">
      <button class="tag-chip" onclick='App.filterByTag(${JSON.stringify(tag)})' title="Show #${esc(tag)} tasks">#${esc(tag)}</button>
      <span class="proj-name"></span>
      <span class="tag-count">${active} active · ${tasks} total</span>
      <button class="icon-btn edit" onclick='App.renameTag(${JSON.stringify(tag)})' title="Rename or merge">✎</button>
    </div>`;
  });
  return html + `</div><p style="padding:4px 16px;font-size:12px;color:var(--muted)">Renaming a tag to one that already exists merges them.</p>`;

App.renameTag = async function(tag) {
  const name = prompt(`Rename #${tag} to:`, tag);
  if (!name || !name.trim() || name.trim() === tag) return;
  try {
    App.tags = await api('PATCH', `/api/tags/${encodeURIComponent(tag)}`, { name: name.trim() });
    if (App.tagFilters.delete(tag)) App.tagFilters.add(name.trim().replace(/^#/, '').toLowerCase().split(/\s+/).join('-'));
    App.renderMain();
    App.toast('✓ Tag renamed');
    App.loadTasks();
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.changeSettingsProvider = function(id) {
  const f = App.settingsForm;
  f.provider = id;
  f.api_key = '';
  f.base_url = '';
  // Keep the saved model when switching back to the saved provider
  f.model = id === App.settings.llm.provider ? App.settings.llm.model : '';
  if (id === App.settings.llm.provider) f.base_url = App.settings.llm.base_url;
  App.settingsModels = [];
  App.settingsTest = null;
  App.renderMain();
};

App.saveBriefKeywords = async function() {
  const kws = (App.briefKeywordsText || '').split('\n').map(s => s.trim()).filter(Boolean);
  try {
    const res = await api('PUT', '/api/brief/keywords', { keywords: kws });
    App.briefKeywordsText = res.keywords.join('\n');
    App.toast(`✓ Saved ${res.keywords.length} keyword(s)`);
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.toggleBriefCalendar = async function(label, enabled) {
  try {
    await api('PUT', '/api/brief/calendars', { label, enabled });
    App.briefCalendars = (await api('GET', '/api/brief/calendars')).calendars;
  } catch(e) { App.toast('✗ ' + e.message); }
  App.renderMain();
};

App.deleteBriefCalendar = async function(label) {
  try {
    await api('DELETE', '/api/brief/calendars/' + encodeURIComponent(label));
    App.briefCalendars = App.briefCalendars.filter(c => c.label !== label);
    App.toast('✓ Calendar removed');
  } catch(e) { App.toast('✗ ' + e.message); }
  App.renderMain();
};

App.addBriefCalendar = async function() {
  const f = App.briefCalForm || {};
  const label = (f.label || '').trim(), url = (f.url || '').trim();
  if (!label || !url) { App.toast('✗ Label and URL are both required'); return; }
  try {
    await api('PUT', '/api/brief/calendars', { label, url, enabled: true });
    App.briefCalendars = (await api('GET', '/api/brief/calendars')).calendars;
    App.briefCalForm = { label: '', url: '' };
    App.toast('✓ Calendar saved');
  } catch(e) { App.toast('✗ ' + e.message); }
  App.renderMain();
};

App.settingsBody = function() {
  const f = App.settingsForm;
  return { provider: f.provider, model: (f.model || '').trim(), base_url: (f.base_url || '').trim(),
           api_key: (f.api_key || '').trim(), token_limit: parseInt(f.token_limit) || null };
};

App.loadSettingsModels = async function() {
  App.toast('Loading models…');
  try {
    const res = await api('POST', '/api/settings/models', App.settingsBody());
    App.settingsModels = res.models;
    App.renderMain();
    App.toast(res.models.length ? `✓ ${res.models.length} models` : 'No models returned');
    const m = $('s-model'); if (m) m.focus();
  } catch(e) { App.toast('✗ ' + e.message, 4000); }
};

App.testSettings = async function() {
  App.settingsTest = { ok: true, text: 'Testing…' };
  App.renderMain();
  try {
    const res = await api('POST', '/api/settings/test', App.settingsBody());
    App.settingsTest = res.ok
      ? { ok: true,  text: `✓ ${res.model} replied: ${res.reply}` }
      : { ok: false, text: '✗ ' + res.error };

App.saveSettings = async function() {
  try {
    App.settings = await api('PUT', '/api/settings', App.settingsBody());
    App.settingsForm = { ...App.settings.llm, token_limit: App.settings.chat.token_limit };

App.clearSettingsKey = async function() {
  const prov = App.settingsProvider(App.settingsForm.provider);

  try {
    // Clearing a key also saves the rest of the form, so require a model like Save does

// ── Journal view ──────────────────────────────────────────────────────────────
App.loadJournal = async function() {
  try {
    const q = App.journalQuery.trim();
    App.journalList = await api('GET', '/api/journal?limit=200' + (q ? '&q=' + encodeURIComponent(q) : '')
      + (App.journalSince ? '&since=' + App.journalSince : '') + (App.journalUntil ? '&until=' + App.journalUntil : ''));
  } catch(e) { App.toast('✗ ' + e.message); }
};

function journalDay(date, opts) {
  return new Date(date + 'T00:00:00').toLocaleDateString([], opts);
}

App.buildJournalView = function() {
  let html = `<div class="view-header">Journal</div>
    <div class="jr-search"><input id="search-input" type="search" placeholder="Search journal…"
      value="${esc(App.journalQuery)}" oninput="App.onJournalSearch(this.value)" autocomplete="off"></div>
    <div class="jr-filters"><span>From</span><input type="date" value="${esc(App.journalSince)}" onchange="App.setJournalDate('journalSince', this.value)">
      <span>to</span><input type="date" value="${esc(App.journalUntil)}" onchange="App.setJournalDate('journalUntil', this.value)">
      ${App.journalSince || App.journalUntil ? `<button class="abtn" onclick="App.setJournalDate('journalSince', ''); App.setJournalDate('journalUntil', '')">Clear</button>` : ''}</div>`;
  if (!App.journalList.length) {
    const msg = App.journalQuery || App.journalSince || App.journalUntil ? `No entries match your filters` : 'No journal entries yet';
    return html + `<div class="empty"><div class="empty-icon">📓</div><p>${msg}</p></div>`;
  }
  let month = null;
  App.journalList.forEach(j => {
    const m = j.date.slice(0, 7);
    if (m !== month) {
      month = m;
      html += `<div class="sec">${esc(journalDay(j.date, { month: 'long', year: 'numeric' }))}</div>`;
    }
    const sel = App.journal && App.journal.id === j.id ? ' selected' : '';
    html += `<div class="card${sel}" role="button" tabindex="0" data-journal="${j.id}" onclick="App.openJournal(${j.id})"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();App.openJournal(${j.id})}">
      <div class="jr-top">
        <span class="jr-date">${esc(journalDay(j.date, { weekday: 'short', day: 'numeric', month: 'short' }))}</span>
        <span class="jr-title">${esc(j.title || '')}</span>
        <span class="due" title="Submitted">${esc(j.created.slice(11, 16))}</span>
        ${j.has_summary ? '' : '<span class="jr-flag" title="No revised summary yet">raw only</span>'}
      </div>
      <div class="jr-excerpt">${esc(j.excerpt)}</div>
    </div>`;
  });
  return html;
};

  App.journalQuery = q;

App.openJournal = async function(id) {
  try {
    App.journal = await api('GET', '/api/journal/' + id);
    App.task = null;
    App.renderJournalPanel();
    $('panel').classList.add('open');
    document.body.classList.add('panel-open');
    App.markSelected();
    App.markJournalSelected();

App.renderJournalPanel = function() {

  const stamp = ts => ts.replace('T', ' ').slice(0, 16);
  let pills = `<span class="meta-pill" style="cursor:default"><span class="lbl">Submitted</span><span class="val">${esc(stamp(j.created))}</span></span>`;
  if (j.updated !== j.created) {
    pills += `<span class="meta-pill" style="cursor:default"><span class="lbl">Revised</span><span class="val">${esc(stamp(j.updated))}</span></span>`;
  }
  if (j.source) {
    pills += `<span class="meta-pill" style="cursor:default"><span class="lbl">Via</span><span class="val">${esc(j.source)}</span></span>`;
  }
  $('panel-info').innerHTML = `<h2>${esc(j.title || day)}</h2>
    ${j.title ? `<div style="font-size:13px;color:var(--muted)">${esc(day)}</div>` : ''}
    <div class="panel-meta">${pills}</div>`;
  $('panel-actions').innerHTML = `<button class="abtn" onclick="App.openSheet('edit-journal')">✎ Edit</button>
    <button class="abtn dng" onclick="App.deleteJournal()">🗑 Delete</button>`;

  const pane = App.journalPane;
  const body = pane === 'raw'
    ? (j.raw.trim() ? `<div class="jr-raw">${esc(j.raw)}</div>` : `<p class="md-empty">No raw text.</p>`)
    : (j.summary.trim() ? `<div class="md">${mdToHtml(j.summary)}</div>` : `<p class="md-empty">No summary yet.</p>`);
  $('panel-body').innerHTML = `<div class="jr-pane">
      <button class="filter-btn${pane === 'summary' ? ' active' : ''}" onclick="App.setJournalPane('summary')">Markdown</button>
      <button class="filter-btn${pane === 'raw' ? ' active' : ''}" onclick="App.setJournalPane('raw')">Raw</button>
      ${pane === 'raw' ? `<div class="kebab-wrap">
        <button class="kebab-btn" title="More" onclick="event.stopPropagation(); this.nextElementSibling.classList.toggle('open')">⋮</button>
        <div class="kebab-menu"><div class="kebab-item" onclick="App.summarizeEntry()">✨ ${j.summary.trim() ? 'Regenerate' : 'Generate'} summary with AI</div></div>
      </div>` : ''}

};

App.summarizeEntry = async function() {
  const j = App.journal;
  document.querySelectorAll('.kebab-menu').forEach(m => m.classList.remove('open'));
  if (!j || !j.raw.trim()) { App.toast('No raw text to summarize'); return; }
  if (j.summary.trim() && !confirm('Replace the existing summary?')) return;
  App.toast('Summarizing…');
  try {
    const r = await api('POST', '/api/journal/summarize', { raw: j.raw });
    const body = { summary: r.summary };
    if (r.title && !j.title) body.title = r.title;
    App.journal = await api('PATCH', '/api/journal/' + j.id, body);
    App.journalPane = 'summary';
    App.renderJournalPanel();
    await App.loadJournal();
    App.renderMain();
    App.toast(r.glossary_left.length ? '⚠ Glossary terms left: ' + r.glossary_left.join('; ') : '✓ Summary generated');
  } catch(e) { App.toast('✗ ' + e.message); }
};
