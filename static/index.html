// ── Event log ─────────────────────────────────────────────────────────────────
// Action filter groups; legacy file-era actions (completed, due_set,
// done_recurring, task-level project_renamed) sit beside their current names.
const ACTIVITY_ACTIONS = {
  '':          'Any Action',
  created:     ['Created', 'created,subtask_created,project_created,journal_added'],
  completed:   ['Completed', 'state_changed,completed,completed_recurring,done_recurring,subtask_completed,subtask_reopened,recurring_cancelled'],
  deleted:     ['Deleted', 'deleted,subtask_deleted,project_removed,journal_deleted,glossary_removed'],
  edited:      ['Edited', 'renamed,subtask_renamed,description_updated,note_added,note_edited,note_deleted,journal_updated,glossary_set'],
  scheduled:   ['Due & recurrence', 'due_date_set,due_set,due_cleared,recurrence_set,recurrence_cleared'],
  priority:    ['Priority', 'reprioritized'],
  moved:       ['Moved project', 'reprojected,project_renamed,project_merged,project_recolored'],
  tags:        ['Tags', 'tagged,untagged,tag_renamed,tag_merged'],
};
const ACTIVITY_SCOPES = { '': 'Everything', task: 'Tasks', project: 'Projects', tag: 'Tags', journal: 'Journal',
  glossary: 'Glossary', context: 'Current task', system: 'System' };
const SCOPE_TAGS = { project: 'Project', tag: 'Tag', journal: 'Journal', glossary: 'Glossary',
  context: 'Current task', system: 'System' };

// One event as a sentence. f holds the event's fields: the flat entries of a
// task's log, or an /api/activity event's data.
function describeEvent(action, f, scope) {
  const q = s => `“${s}”`;
  const proj = code => code ? projName(code) : '?';
  const state = { active: 'Reopened', completed: 'Completed', archive: 'Archived' };
  const days = n => `${n} day${n == 1 ? '' : 's'}`;
  // Parent-side subtask events hold the subtask's slug.
  const sub = slug => String(slug || '').replace(/-/g, ' ');
  switch (action) {
    case 'created':
      return 'Created' + (f.project ? ` in ${proj(f.project)}` : '') +
        (f.priority != null ? ` · ${priLabel(f.priority)}` : '') + (f.due ? ` · due ${f.due}` : '') +
        (f.tags ? ' · ' + hashTags(f.tags) : '');
    case 'tagged':             return 'Tagged ' + hashTags(f.tags);
    case 'untagged':           return 'Untagged ' + hashTags(f.tags);
    case 'tag_renamed':        return `Renamed to #${f.new} · ${f.tasks} task${f.tasks == 1 ? '' : 's'}`;
    case 'tag_merged':         return `Merged into #${f.new} · ${f.tasks} task${f.tasks == 1 ? '' : 's'}`;
    case 'state_changed':      return state[f.to_state] || `Moved to ${f.to_state}`;
    case 'completed':          return 'Completed';
    case 'completed_recurring':
    case 'done_recurring':     return 'Done for now' + (f.next_due ? ` · next due ${f.next_due}` : '');
    case 'recurring_cancelled':return 'Recurrence cancelled';
    case 'deleted':
      return 'Deleted' + (f.subtasks ? ` with ${f.subtasks} subtask${f.subtasks == 1 ? '' : 's'}` : '');
    case 'renamed':            return `Renamed from ${q(f.old)}`;
    case 'reprioritized':
      return `Priority ${priLabel(f.old_priority)} → ${priLabel(f.new_priority)}`;
    case 'reprojected':
      return `Moved from ${proj(f.old_project)} to ${proj(f.new_project)}` + (f.via === 'merge' ? ' (merge)' : '');
    case 'project_renamed':
      if (scope === 'project') return `Renamed from ${q(f.old)}`;
      return `Moved from ${proj(f.old_project)} to ${proj(f.new_project)}`;
    case 'due_date_set':
    case 'due_set':            return `Due ${f.date || f.due || ''}`.trim();
    case 'due_cleared':        return 'Due date cleared';
    case 'recurrence_set':     return `Repeats every ${days(f.interval)}`;
    case 'recurrence_cleared': return 'Stopped repeating';
    case 'description_updated':return 'Description edited';
    case 'note_added':         return 'Note added';
    case 'note_edited':        return 'Note edited';
    case 'note_deleted':       return 'Note deleted';
    case 'subtask_created':    return `Subtask added: ${sub(f.subtask)}`;
    case 'subtask_completed':  return `Subtask done: ${sub(f.subtask)}`;
    case 'subtask_reopened':   return `Subtask reopened: ${sub(f.subtask)}`;
    case 'subtask_renamed':    return `Subtask renamed: ${sub(f.old)} → ${sub(f.new)}`;
    case 'subtask_deleted':    return `Subtask deleted: ${sub(f.subtask)}`;
    case 'project_created':    return 'Project created';
    case 'project_recolored':  return 'Color changed';
    case 'project_removed':    return 'Project removed';
    case 'project_merged':
      return `Merged into ${f.into_name || proj(f.into)} · ${f.count} task${f.count == 1 ? '' : 's'} moved`;
    case 'glossary_removed':   return `Removed ${q(f.old)}`;
    case 'glossary_set':       return (f.old ? `${q(f.old)} → ` : '→ ') + q(f.new);
    case 'journal_added':      return 'Entry added';
    case 'journal_updated':
      return 'Edited ' + (f.fields || []).map(k => k === 'entry_date' ? 'date' : k).join(', ') +
        (f.new_date ? ` · moved to ${f.new_date}` : '');
    case 'journal_deleted':    return 'Entry deleted';
    case 'context_set':        return 'Set as current task';
    case 'context_cleared':    return 'No longer current task' + (f.reason ? ` (${f.reason})` : '');
    case 'schema_upgraded':    return `Database upgraded to schema ${f.to_version}`;
  }
  const extras = Object.entries(f).filter(([k]) => k !== 'source' && !k.endsWith('_id'))
    .map(([k, v]) => `${k}=${v}`).join('  ');
  return action.replace(/_/g, ' ') + (extras ? ` · ${extras}` : '');
}

function hashTags(tags) {
  return (tags || []).map(g => '#' + g).join(' ');
}

function sourceTag(src) {
  return src ? `<span class="act-src" title="Made via ${esc(src)}">${esc(src)}</span>` : '';
}

App.loadActivity = async function(append) {
  const f = App.activityFilter;
  const params = ['limit=101', 'offset=' + (append ? App.activity.length : 0)];
  if (f.scope) params.push('scope=' + f.scope);
  if (f.project) params.push('project=' + encodeURIComponent(f.project));
  if (f.action) params.push('action=' + ACTIVITY_ACTIONS[f.action][1]);
  if (f.task) params.push('task=' + encodeURIComponent(f.task));
  try {
    const page = await api('GET', '/api/activity?' + params.join('&'));
    // One extra row tells whether there is another page.
    App.activityMore = page.length > 100;
    App.activity = (append ? App.activity : []).concat(page.slice(0, 100));
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.setActivityFilter = async function(key, value) {
  App.activityFilter[key] = value;
  await App.loadActivity();
  App.renderMain();
};

App.showTaskActivity = function(slug) {
  App.activityFilter = { scope: '', project: '', action: '', task: slug };
  App.activityTaskName = App.task && App.task.ref === slug ? App.task.name : slug;
  App.closePanel();
  App.setView('activity');
};

App.moreActivity = async function() {

App.buildActivityView = function() {
  const f = App.activityFilter;
  const chevron = `<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>`;
  const dropdown = (id, key, label, options) => `<div class="filter-wrap">
      <button class="filter-btn${f[key] ? ' active' : ''}" onclick="App.toggleDropdown('${id}',event)">${esc(label)} ${chevron}</button>
      <div class="filter-dropdown" id="${id}">${options.map(([v, l]) =>
        `<div class="fdd-item${f[key] === v ? ' on' : ''}" onclick='App.setActivityFilter(${JSON.stringify(key)},${JSON.stringify(v)})'>${esc(l)}</div>`
      ).join('')}</div>
    </div>`;
  const actionLabel = a => a ? ACTIVITY_ACTIONS[a][0] : ACTIVITY_ACTIONS[''];
  const filtered = f.scope || f.project || f.action || f.task;
  const projects = [['', 'All Projects'], ...Object.keys(App.projects)
    .map(c => [c, projName(c)]).sort((a, b) => a[1].localeCompare(b[1]))];
  let html = `<div class="view-header">Activity</div>
    <div class="filter-bar">
      ${f.task ? `<button class="filter-btn active" onclick="App.setActivityFilter('task','')" title="Show all tasks">Task: ${esc(App.activityTaskName || f.task)} ✕</button>` : ''}
      ${dropdown('act-scope-dd', 'scope', ACTIVITY_SCOPES[f.scope], Object.entries(ACTIVITY_SCOPES))}
      ${dropdown('act-proj-dd', 'project', f.project ? projName(f.project) : 'All Projects', projects)}
      ${dropdown('act-action-dd', 'action', actionLabel(f.action), Object.keys(ACTIVITY_ACTIONS).map(a => [a, actionLabel(a)]))}
      ${filtered ? `<button class="filter-clear" onclick="App.clearActivityFilters()">Clear</button>` : ''}
    </div>`;
  if (!App.activity.length) {
    return html + `<div class="empty"><div class="empty-icon">🕘</div><p>No activity${filtered ? ' matches these filters' : ' yet'}</p></div>`;
  }
  let day = null;
  App.activity.forEach(e => {
    const d = e.ts.slice(0, 10);
    if (d !== day) {
      day = d;
      html += `<div class="sec">${esc(journalDay(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</div>`;
    }
    html += App.activityRow(e);
  });
  if (App.activityMore) {
    html += `<button class="abtn act-more" onclick="App.moreActivity()">Load older</button>`;
  }
  return html;
};

App.activityRow = function(e) {
  const f = e.data || {};
  let target, open = '';
  if (e.slug) {
    const parent = e.parent ? `<span class="act-parent">${esc(e.parent_name || e.parent)} › </span>` : '';
    target = `${parent}<span class="act-target${e.deleted ? ' gone' : ''}">${esc(e.name || e.slug)}</span>`;
    if (e.open) open = `App.openTask(${JSON.stringify(e.open)})`;
  } else if (e.scope === 'project') {
    target = `<span class="act-target">${esc(f.name || projName(e.ref))}</span>`;
  } else if (e.scope === 'journal') {
    target = `<span class="act-target">Journal ${esc(f.date || '')}${f.title ? ' · ' + esc(f.title) : ''}</span>`;
    if (e.action !== 'journal_deleted') open = `App.openJournal(${JSON.stringify(Number(e.ref))})`;
  } else if (e.scope === 'glossary') {
    target = `<span class="act-target">${esc(e.ref)}</span>`;
  } else if (e.scope === 'tag') {
    target = `<span class="act-target">#${esc(e.ref)}</span>`;
  } else if (e.scope === 'system') {
    target = `<span class="act-target">Toledo</span>`;
  } else {
    target = `<span class="act-target">${esc(SCOPE_TAGS[e.scope] || e.scope)}</span>`;
  }
  const scope = e.scope !== 'task' ? `<span class="act-scope">${esc(SCOPE_TAGS[e.scope] || e.scope)}</span>` : '';
  const attrs = open
    ? ` class="act-row link" role="button" tabindex="0" onclick='${open}' onkeydown='if(event.key==="Enter"){${open}}'`
    : ` class="act-row"`;
  return `<div${attrs}>
    <span class="act-time">${esc(e.ts.slice(11, 16))}</span>
    <div class="act-main">
      <div>${scope}${target}</div>
      <div class="act-desc">${esc(describeEvent(e.action, f, e.scope))}</div>
    </div>
    ${sourceTag(f.source)}
  </div>`;
};

App.clearActivityFilters = async function() {

App.renderPanel = function() {
  const tk = App.task;
  if (!tk) return;

  const overdue = tk.overdue;
  let metaPills = '';

  // Due date pill
  if (tk.due) {
    metaPills += `<button class="meta-pill${overdue ? ' over' : ''}" onclick="App.openSheet('set-due')" title="Change due date">
      <span class="lbl">Due</span>
      <span class="val">${esc(tk.due)}</span>
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>`;
  } else {
    metaPills += `<button class="meta-pill" onclick="App.openSheet('set-due')" title="Set due date">
      <span class="lbl">Due</span><span class="val" style="color:var(--muted)">not set</span>
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>`;
  }

  // Priority pill
  const pLabel = priLabel(tk.priority), pColor = priColor(tk.priority);
  metaPills += `<button class="meta-pill" onclick="App.openSheet('reprioritize')" title="Change priority">
    <span class="lbl">Priority</span>
    <span class="val" style="color:${pColor};font-weight:700">${tk.priority} · ${pLabel}</span>
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>`;

  // Project pill
  const tkProjColorRaw = projColor(tk.project);
  const tkProjColor = readableAccent(tkProjColorRaw, [36, 36, 36], 0);
  // A subtask's project is its parent's.
  metaPills += tk.parent
    ? `<span class="meta-pill" style="cursor:default;border-color:${hexToRgba(tkProjColorRaw,.3)}" title="Set by the parent task">
    <span class="lbl">Project</span>
    <span class="val" style="color:${tkProjColor}">${esc(projName(tk.project))}</span>
  </span>`
    : `<button class="meta-pill" onclick="App.openSheet('change-project')" title="Change project"
    style="border-color:${hexToRgba(tkProjColorRaw,.3)}">
    <span class="lbl">Project</span>
    <span class="val" style="color:${tkProjColor}">${esc(projName(tk.project))}</span>
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>`;

  // Tags pill; a subtask shows its parent's
  const tagVal = tk.tags.length
    ? `<span class="val">${esc(hashTags(tk.tags))}</span>`
    : `<span class="val" style="color:var(--muted)">none</span>`;
  metaPills += tk.parent
    ? `<span class="meta-pill" style="cursor:default" title="Set by the parent task"><span class="lbl">Tags</span>${tagVal}</span>`
    : `<button class="meta-pill" onclick="App.openSheet('edit-tags')" title="Edit tags">
    <span class="lbl">Tags</span>${tagVal}
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>`;

  // State pill
  metaPills += `<span class="meta-pill" style="cursor:default;background:none;border-color:transparent">
    <span class="val state-tag s-${tk.state}">${tk.state}</span>
  </span>`;

  if (tk.recurrence) {
    metaPills += `<span class="meta-pill" style="cursor:default">
      <span class="lbl">Recurs</span>
      <span class="val">every ${tk.recurrence}d</span>
    </span>`;
  }

  const crumb = tk.parent
    ? `<button class="panel-crumb" onclick='App.openTask(${JSON.stringify(tk.parent.slug)})'>↑ ${esc(tk.parent.name)}</button>`
    : '';
  $('panel-info').innerHTML = `${crumb}<h2>${esc(tk.name)}</h2><div class="panel-meta">${metaPills}</div>`;

  // Action buttons
  let actions = '';
  if (tk.state === 'active') {
    actions += `<button class="abtn pri" onclick="App.doAction('done')">✓ Mark Completed</button>`;
    if (tk.recurrence) {
      actions += `<button class="abtn wrn" onclick="App.doAction('cancel')">✕ Cancel Recurrence</button>`;
    }
  } else if (tk.state === 'completed') {
    if (!tk.parent) actions += `<button class="abtn" onclick="App.doAction('archive')">Archive</button>`;
    actions += `<button class="abtn suc" onclick="App.doMove('active')">↩ Make Active</button>`;
  } else if (tk.state === 'archive') {
    actions += `<button class="abtn suc" onclick="App.doMove('active')">↩ Make Active</button>`;
    actions += `<button class="abtn dng" onclick="App.confirmDelete()">🗑 Delete</button>`;
  }
  actions += `<button class="abtn" onclick="App.openSheet('rename-task')">✎ Rename</button>`;
  $('panel-actions').innerHTML = actions;

  // Body sections
  let body = '';

  if (overdue) {
    body += `<div class="over-banner">⚠ Overdue since ${tk.due}</div>`;
  }

  // Description
  const descHtml = renderDesc(tk.description);
  body += `<div class="psec">
    <div class="psec-head">
      <span class="psec-title">Description</span>
      <button class="psec-act" onclick="App.openSheet('edit-desc')">Edit</button>
    </div>
    <div class="psec-body"><div class="md">${descHtml}</div></div>
  </div>`;

  // Subtasks
  const allSubs = [
    ...tk.subtasks.active.map(s => ({ ...s, done: false })),
    ...tk.subtasks.completed.map(s => ({ ...s, done: true })),
  ];
  let subsHtml = allSubs.length === 0
    ? `<p class="md-empty">No subtasks yet.</p>`
    : allSubs.map(s => `<div class="sub-item">
        <button class="sub-check${s.done ? ' done' : ''}"
          onclick='${s.done ? `App.undoSubtask(${JSON.stringify(s.slug)})` : `App.doneSubtask(${JSON.stringify(s.slug)})`}'
          title="${s.done ? 'Mark incomplete' : 'Mark done'}"></button>
        <span class="sub-name${s.done ? ' done' : ''}" onclick="App.openTask('#${s.id}')" title="Open subtask">${esc(s.name)}</span>
        <button class="sub-rename" onclick='App.openSubRename(${JSON.stringify(s.slug)},${JSON.stringify(s.name)})' title="Rename">✎</button>
        <button class="sub-delete" onclick='App.deleteSubtask(${JSON.stringify(s.slug)},${JSON.stringify(s.name)})' title="Delete">🗑</button>
      </div>`).join('');
  // Subtasks don't nest.
  if (!tk.parent) body += `<div class="psec">
    <div class="psec-head">
      <span class="psec-title">Subtasks</span>
      <button class="psec-act" onclick="App.openSheet('add-subtask')">+ Add</button>
    </div>
    <div class="psec-body">${subsHtml}</div>
  </div>`;

  // Notes
  let wlogHtml = '';
  if (!(tk.notes || []).length) {
    wlogHtml = `<p class="md-empty">No notes yet.</p>`;
  } else {
    wlogHtml = [...tk.notes].reverse().map(n => {
      const ts = (n.ts || '').slice(0, 16).replace('T', ' ') + (n.source === 'chat' ? ' (Chat)' : '');
      if (App.noteEditing === n.id) {
        return `<div class="wlog-entry"><div class="wlog-ts">${esc(ts)}</div>
          <textarea id="note-edit" class="wlog-edit" aria-label="Edit note"
            onkeydown="App.noteEditKey(event)">${esc(n.text.trim())}</textarea>
          <div class="wlog-acts">
            <button class="psec-act" onclick="App.saveNote(${n.id})">Save</button>
            <button class="psec-act" onclick="App.editNote(null)">Cancel</button>
          </div></div>`;
      }
      return `<div class="wlog-entry"><div class="wlog-ts">${esc(ts)}
          <span class="wlog-acts">
            <button class="psec-act" onclick="App.editNote(${n.id})">Edit</button>
            <button class="psec-act" onclick="App.deleteNote(${n.id})">Delete</button>
          </span></div>
        <div class="wlog-text">${esc(n.text.trim())}</div></div>`;
    }).join('');
  }
  const draft = App.noteDrafts[tk.ref] || '';
  const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl';
  body += `<div class="psec">
    <div class="psec-head">
      <span class="psec-title">Notes</span>
    </div>
    <div class="psec-body">
      <div class="note-compose">
        <textarea id="note-input" placeholder="Add a note…" aria-label="New note"
          oninput="App.noteInput(this)" onkeydown="App.noteKey(event)">${esc(draft)}</textarea>
        <div class="note-compose-row">
          <span class="note-hint">${mod}+Enter to add</span>
          <button id="note-submit" class="btn btn-p" onclick="App.submitNote()"${draft.trim() ? '' : ' disabled'}>Add note</button>
        </div>
      </div>
      ${wlogHtml}
    </div>
  </div>`;

  // Activity log
  let logHtml = '';
  if (tk.log && tk.log.length) {
    logHtml = [...tk.log].reverse().map(e => {
      const { ts, action, ...rest } = e;
      return `<div class="log-entry">
        <div class="log-ts">${ts.replace('T', ' ').slice(0, 16)}</div>
        <div class="log-body">
          <div class="log-action">${esc(describeEvent(action, rest, 'task'))}</div>
        </div>
        ${sourceTag(rest.source)}
      </div>`;
    }).join('');
  } else {
    logHtml = `<p class="md-empty">No activity yet.</p>`;
  }
  body += `<div class="psec" style="border-bottom:none">
    <details class="log-details">
      <summary>Activity Log</summary>
      <div class="log-inner">${logHtml}
        <button class="log-more" onclick='App.showTaskActivity(${JSON.stringify(tk.ref)})'>Full history with subtasks ›</button>
      </div>
    </details>
  </div>`;

  $('panel-body').innerHTML = body;
};

App.doAction = async function(action) {
  if (!App.task) return;
  try {
    const d = await api('POST', `/api/tasks/${encodeURIComponent(App.task.ref)}/${action}`);
    if (action === 'done' && d.recurring) {
      App.toast(`↻ Next due: ${d.next_due}`);
      App.task = await api('GET', '/api/tasks/' + encodeURIComponent(App.task.ref));
      App.renderPanel();
    } else {
      App.toast(action === 'done' ? '✓ Completed' : action === 'archive' ? 'Archived' : 'Done');
      App.leaveTask();
    }
    App.loadTasks().then(() => App.renderMain());
  } catch(e) { App.toast('✗ ' + e.message); }
};

// After closing out the open task: back to the parent for a subtask.
App.leaveTask = function() {
  if (App.task?.parent) App.openTask(App.task.parent.slug);
  else App.closePanel();
};

App.doMove = async function(state) {
  if (!App.task) return;
  try {
    await api('POST', `/api/tasks/${encodeURIComponent(App.task.ref)}/move`, { state });
    App.toast(`→ ${state}`);
    App.leaveTask();
    App.loadTasks().then(() => App.renderMain());
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.doneSubtask = async function(subSlug) {
  if (!App.task) return;
  try {
    await api('POST', `/api/tasks/${encodeURIComponent(App.task.ref)}/subdone`, { slug: subSlug });
    App.task = await api('GET', '/api/tasks/' + encodeURIComponent(App.task.ref));
    App.renderPanel();
    App.toast('✓ Subtask done');
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.undoSubtask = async function(subSlug) {
  if (!App.task) return;
  try {
    await api('POST', `/api/tasks/${encodeURIComponent(App.task.ref)}/subundo`, { slug: subSlug });
    App.task = await api('GET', '/api/tasks/' + encodeURIComponent(App.task.ref));
    App.renderPanel();
    App.toast('↩ Subtask reopened');
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.deleteSubtask = async function(subSlug, subName) {
  if (!App.task || !confirm(`Delete subtask "${subName}"? This cannot be undone.`)) return;
  try {
    await api('DELETE', `/api/tasks/${encodeURIComponent(App.task.ref)}/sub/${encodeURIComponent(subSlug)}`);
    App.task = await api('GET', '/api/tasks/' + encodeURIComponent(App.task.ref));
    App.renderPanel();
    App.toast('🗑 Subtask deleted');
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.confirmDelete = async function() {
  if (!App.task || !confirm(`Delete "${App.task.name}"? This cannot be undone.`)) return;
  try {
    await api('DELETE', `/api/tasks/${encodeURIComponent(App.task.ref)}`);
    App.leaveTask();
    App.toast('Deleted');
    App.loadTasks().then(() => App.renderMain());
  } catch(e) { App.toast('✗ ' + e.message); }
};

// ── Sheet submitters ──────────────────────────────────────────────────────────
App.submitNewTask = async function() {
  const name = $('f-name')?.value.trim();
  if (!name) { App.toast('Name is required'); return; }
  const recur = parseInt($('f-recur')?.value || '0') || null;
  try {
    await api('POST', '/api/tasks', {
      name, recur,
      priority:    parseInt($('f-pri')?.value || '50'),
      project:     ($('f-proj')?.value || 'GEN').toUpperCase(),
      due:         $('f-due')?.value || null,
      description: $('f-desc')?.value.trim() || null,
      tags:        $('f-tags')?.value || null,
    });
    App.closeSheet();
    App.toast('✓ Task created');
    await Promise.all([App.loadTasks(), App.loadTags()]);
    App.renderMain();
  } catch(e) { App.toast('✗ ' + e.message); }
};

// Unsent note text per task, so a re-render or closing the panel keeps it.
App.noteDrafts = {};

App.noteInput = function(el) {
  if (App.task) App.noteDrafts[App.task.ref] = el.value;
  $('note-submit').disabled = !el.value.trim();
};

App.noteKey = function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    App.submitNote();
  }
};

App.submitNote = async function() {
  const input = $('note-input'), btn = $('note-submit');
  const text = input?.value.trim();
  if (!text || !App.task || btn.disabled) return;
  const slug = App.task.ref;
  btn.disabled = true;
  try {
    await api('POST', `/api/tasks/${encodeURIComponent(slug)}/note`, { text });
    delete App.noteDrafts[slug];
    App.toast('✓ Note added');
    const updated = await api('GET', '/api/tasks/' + encodeURIComponent(slug));
    if (App.task?.ref !== slug) return;  // moved on to another task meanwhile
    App.task = updated;
    App.renderPanel();
    $('note-input')?.focus();
  } catch(e) {
    btn.disabled = false;
    App.toast('✗ ' + e.message);
  }
};

App.noteEditing = null;

App.editNote = function(id) {
  App.noteEditing = id;
  App.renderPanel();
  $('note-edit')?.focus();
};

App.noteEditKey = function(e) {
  if (e.key === 'Escape') App.editNote(null);
  else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    App.saveNote(App.noteEditing);
  }
};

App.refreshTask = async function(slug) {
  const updated = await api('GET', '/api/tasks/' + encodeURIComponent(slug));
  if (App.task?.ref !== slug) return;  // moved on to another task meanwhile
  App.task = updated;
  App.renderPanel();
};

App.saveNote = async function(id) {
  const text = $('note-edit')?.value.trim();
  if (!text || !App.task) { App.toast('Note text required'); return; }
  const slug = App.task.ref;
  try {
    await api('PATCH', `/api/tasks/${encodeURIComponent(slug)}/notes/${id}`, { text });
    App.noteEditing = null;
    App.toast('✓ Note updated');
    await App.refreshTask(slug);
  } catch(e) {
    App.toast('✗ ' + e.message);
  }
};

App.deleteNote = async function(id) {
  if (!App.task || !confirm('Delete this note? This cannot be undone.')) return;
  const slug = App.task.ref;
  try {
    await api('DELETE', `/api/tasks/${encodeURIComponent(slug)}/notes/${id}`);
    App.toast('✓ Note deleted');
    await App.refreshTask(slug);
  } catch(e) {
    App.toast('✗ ' + e.message);
  }
};

App.submitSubtask = async function() {
  const name = $('f-name')?.value.trim();
  if (!name || !App.task) { App.toast('Name required'); return; }
  try {
    await api('POST', `/api/tasks/${encodeURIComponent(App.task.ref)}/sub`, {
      name,
      priority: parseInt($('f-pri')?.value || '50'),
      due:      $('f-due')?.value || null,
    });
    App.closeSheet();
    App.task = await api('GET', '/api/tasks/' + encodeURIComponent(App.task.ref));
    App.renderPanel();
    App.toast('✓ Subtask added');
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.submitDue = async function() {
  const date = $('f-due')?.value;
  if (!date || !App.task) { App.toast('Date required'); return; }
  try {
    await api('POST', `/api/tasks/${encodeURIComponent(App.task.ref)}/due`, { date });
    App.closeSheet();
    App.task = await api('GET', '/api/tasks/' + encodeURIComponent(App.task.ref));
    App.renderPanel();
    App.toast('✓ Due date set');
    App.loadTasks().then(() => App.renderMain());
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.setPriQuick = function(val) {
  const el = $('f-pri');
  if (el) el.value = val;
  App.syncPriQuick();
};

App.syncPriQuick = function() {
  const v = $('f-pri')?.value;
  document.querySelectorAll('#sheet-body [data-pri]').forEach(b => b.classList.toggle('on', b.dataset.pri === v));
};

// Existing tags for an input's autocomplete. Typing after a comma still
// completes, since the browser matches the whole value; good enough here.
App.tagDatalist = function(exclude = []) {
  return `<datalist id="tag-options">${App.tags.filter(g => !exclude.includes(g.tag))
    .map(g => `<option value="${esc(g.tag)}">`).join('')}</datalist>`;
};

App.tagSheetBody = function() {
  const tags = App.task?.tags || [];
  const current = tags.length
    ? tags.map(g => `<button class="tag-chip" onclick='App.untagTask(${JSON.stringify(g)})' title="Remove">#${esc(g)}<span class="x">✕</span></button>`).join('')
    : `<span style="color:var(--muted);font-size:13px">No tags yet</span>`;
  const others = App.tags.filter(g => !tags.includes(g.tag));
  const suggest = others.length
    ? `<div class="fg"><label>Existing tags</label><div class="tag-list">${others.map(g =>
        `<button class="tag-chip tag-suggest" onclick='App.tagTask(${JSON.stringify(g.tag)})'>+ #${esc(g.tag)}</button>`).join('')}</div></div>`
    : '';
  return `
    <div class="fg"><label>On this task</label><div class="tag-list">${current}</div></div>
    <div class="fg"><label>Add tags</label>
      <div style="display:flex;gap:6px">
        <input id="f-tags" type="text" autocomplete="off" placeholder="errands, weekend" list="tag-options"
          onkeydown="if(event.key==='Enter'){event.preventDefault();App.tagTask()}" style="flex:1">
        <button class="btn btn-p" style="flex:0 0 auto" onclick="App.tagTask()">Add</button>
      </div>
      ${App.tagDatalist(tags)}
    </div>
    ${suggest}
    <div class="btn-row"><button class="btn btn-s" onclick="App.closeSheet()">Done</button></div>`;
};

// Apply a tag change to the open task and redraw the sheet in place.
App.changeTags = async function(method, tags) {
  if (!App.task) return;
  try {
    App.task = { ...App.task, ...await api(method, `/api/tasks/${encodeURIComponent(App.task.ref)}/tags`, { tags }) };
    await App.loadTags();
    $('sheet-body').innerHTML = App.tagSheetBody();
    $('f-tags')?.focus();
    App.renderPanel();
    App.loadTasks().then(() => App.renderMain());
  } catch(e) { App.toast('✗ ' + e.message); }
};

App.tagTask = function(tag) {
  const tags = tag || $('f-tags')?.value.trim();
  if (!tags) return;
  App.changeTags('POST', tags);
};

App.untagTask = function(tag) {
  App.changeTags('DELETE', tag);
};

      { slug: App._renameSub.slug, name });

App.submitNewProject = async function() {
  const code  = $('f-code')?.value.trim().toUpperCase();
  const pname = $('f-pname')?.value.trim();
  const color = $('f-color')?.value || '#6b9ce8';
  if (!code || !pname) { App.toast('Code and name required'); return; }
  try {
    App.projects = await api('POST', '/api/projects', { code, name: pname, color });
    App.closeSheet();
    App.renderMain();
    App.toast(`✓ Project ${code} added`);
  } catch(e) { App.toast('✗ ' + e.message); }
};

// ── Markdown renderer ─────────────────────────────────────────────────────────
function renderDesc(src) {
  if (!src || !src.trim()) return '<p class="md-empty">No description.</p>';
  const stripped = src.replace(/^#[^\n]*\n+/, '');
  return stripped.trim() ? mdToHtml(stripped) : '<p class="md-empty">No description.</p>';
}

function mdToHtml(src) {
  if (!src) return '';
  const lines = src.split('\n');
  let html = '', inUl = false, inPre = false, table = null;
  const flushUl = () => { if (inUl) { html += '</ul>'; inUl = false; } };
  const isTableRow = line => /^\s*\|.*\|\s*$/.test(line.trim());
  const isSepRow = line => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line.trim());
  const splitRow = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const flushTable = () => {
    if (!table) return;
    const [head, ...body] = table;
    html += '<table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead>';
    if (body.length) {
      html += '<tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
    }
    html += '</table>';
    table = null;
  };
  lines.forEach(line => {
    if (line.startsWith('```')) {
      flushTable();
      if (inPre) { html += '</pre>'; inPre = false; }
      else { flushUl(); html += '<pre>'; inPre = true; }
      return;
    }
    if (inPre) { html += esc(line) + '\n'; return; }
    if (isTableRow(line)) {
      if (table && table.length === 1 && isSepRow(line)) return; // separator row right after the header
      flushUl();
      (table = table || []).push(splitRow(line));
      return;
    }
    flushTable();
    if (/^### /.test(line)) { flushUl(); html += `<h3>${inline(line.slice(4))}</h3>`; return; }
    if (/^## /.test(line))  { flushUl(); html += `<h2>${inline(line.slice(3))}</h2>`; return; }
    if (/^# /.test(line))   { flushUl(); html += `<h1>${inline(line.slice(2))}</h1>`; return; }
    if (/^---$/.test(line)) { flushUl(); html += '<hr>'; return; }
    if (/^[-*] /.test(line)) {
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      return;
    }
    flushUl();
    if (line.trim() === '') { html += '<br>'; return; }
    html += `<p>${inline(line)}</p>`;
  });
  flushUl();
  flushTable();
  return html;
}

function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,     '<em>$1</em>')
    .replace(/_(.+?)_/g,       '<em>$1</em>')
    .replace(/`(.+?)`/g,       '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function projName(code) {
  const p = App.projects[code];
  return (p && p.name) || (typeof p === 'string' ? p : null) || code;
}
function projColor(code) {
  const p = App.projects[code];
  return (p && p.color) || '#6b9ce8';
}
